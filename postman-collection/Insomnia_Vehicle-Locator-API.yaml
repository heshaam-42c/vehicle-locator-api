              - url: "{{baseUrl}}/vehicles/:vehicleId/location"
                name: API6:2019 - Schema Injection
                meta:
                  id: req_33a2aef1e9854c78a381984784d49e71
                  created: 1783628443589
                  modified: 1783628443589
                  isPrivate: false
                  description: ""
                  sortKey: -1783628434090
                method: PUT
                body:
                  mimeType: text/plain
                  text: |-
                    {
                      "lat": 41.0,
                      "lng": -75.0,
                      "status": "inactive"
                    }
                headers:
                  - name: Content-Type
                    value: application/json
                scripts:
                  preRequest: >-
                    // VIN characters (excluding I, O, Q)

                    const vinChars = 'ABCDEFGHJKLMNPRSTUVWXYZ0123456789';


                    function generateRandomVIN() {
                        let vin = '';
                        for (let i = 0; i < 17; i++) {
                            vin += vinChars.charAt(Math.floor(Math.random() * vinChars.length));
                        }
                        return vin;
                    }


                    // Retrieve API host

                    let myHost = insomnia.collectionVariables.get('baseUrl');

                    console.log(myHost);

                    insomnia.sendRequest({
                        url: myHost+'/vehicles',
                        method: 'POST',
                        header: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                            'Authorization': 'Bearer ' + insomnia.collectionVariables.get('bearerAuth')
                          },
                        body: {
                            mode: 'raw',
                            raw: JSON.stringify(
                                {
                                    "vin": generateRandomVIN(),
                                    "lat": 40.7128,
                                    "lng": -74.0060,
                                    "make": "Toyota",
                                    "model": "Camry",
                                    "year": 2025,
                                    "color": "Blue"
                                })
                        }
                    }, function (err, res) {
                        console.log (res)
                        insomnia.collectionVariables.set("vehicleId", res.json().id);
                    });
                  afterResponse: >-
                    insomnia.test("Status code is 400", function () {
                        insomnia.expect(insomnia.response.code).to.be.equal(400);
                    });
                settings:
                  renderRequestBody: true
                  encodeUrl: true
                  followRedirects: global
                  cookies:
                    send: true
                    store: true
                  rebuildPath: true
                pathParameters:
                  - name: vehicleId
                    value: "{{vehicleId}}"
          - name: High-Score Attacks
            meta:
